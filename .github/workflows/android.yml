name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # 1. 获取日期并设置为环境变量
    - name: Set version and date
      run: |
        DATE=$(date +'%Y%m%d')
        echo "DATE=$DATE" >> $GITHUB_ENV
        echo "VERSION=v$DATE" >> $GITHUB_ENV

    # 2. 自动修改 build.gradle 中的 versionName
    - name: Update versionName in build.gradle
      run: |
        # 针对传统 Groovy 格式 (build.gradle):
        sed -i -E 's/versionName "[^"]*"/versionName "'"$VERSION"'"/' app/build.gradle
        
        # 如果你的项目使用的是 Kotlin DSL (build.gradle.kts)，请注释掉上面那行，取消注释下面这行：
        # sed -i -E 's/versionName = "[^"]*"/versionName = "'"$VERSION"'"/' app/build.gradle.kts
        
        echo "当前 versionName 已修改为:"
        grep versionName app/build.gradle

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 3. 将生成的 APK 重命名为 v年月日.apk
    - name: Rename APK
      run: |
        # 在你自定义的 app/release 目录下找到 apk 并重命名
        find app/release -name "*.apk" -exec mv {} app/release/$VERSION.apk \;
        echo "重命名完成，当前文件列表:"
        ls -la app/release/

    - name: Create GitHub Release and Upload Assets
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        generate_release_notes: true
        # 上传重命名后的精确文件
        files: |
          app/release/${{ env.VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
